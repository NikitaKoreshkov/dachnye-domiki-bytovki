<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dachnye-Domiki-bytovki Screenshots</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; }
        .screenshot { width: 300px; margin: 20px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); overflow: hidden; }
        .label { text-align: center; padding: 8px; font-size: 14px; color: #333; background: white; }
        iframe { width: 100%; height: 600px; border: none; display: block; }
        h1 { text-align: center; padding: 30px 20px; color: #5D4E37; }
    </style>
</head>
<body>
    <h1>🏠 Дачные-Домики-Бытовки — Скриншоты сайта</h1>
    
    <!-- Desktop Home -->
    <div class="label"><strong>Desktop Homepage (1920×1080)</strong></div>
    <iframe src="http://localhost:3000" style="width:1920px;height:2400px;border:none;display:block;margin:0 auto;"></iframe>
    
    <!-- Catalog -->
    <div class="label"><strong>Catalog Page (1920×1080)</strong></div>
    <iframe src="http://localhost:3000/catalog" style="width:1920px;height:2400px;border:none;display:block;margin:0 auto;"></iframe>
    
    <!-- Mobile -->
    <div class="label"><strong>Mobile Viewport (390×844)</strong></div>
    <iframe src="http://localhost:3000" style="width:390px;height:2400px;border:none;display:block;margin:0 auto;"></iframe>

</body>
</html>
